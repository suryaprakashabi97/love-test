<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Love Story ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating hearts -->
    <div id="hearts-container"></div>

    <main class="app">

        <!-- =========================
             WELCOME PAGE
        ========================== -->
        <section id="welcomePage" class="page active">

            <div class="card">

                <div class="big-heart">❤️</div>

                <h1>Hey You! 💕</h1>

                <p class="subtitle">
                    I have a very important question for you...
                </p>

                <h2>Do you like me? 🥺❤️</h2>

                <div class="button-area">
                    <button id="yesButton" class="btn yes-btn">
                        Yes ❤️
                    </button>

                    <button id="noButton" class="btn no-btn">
                        No 😢
                    </button>
                </div>

                <p id="noMessage" class="reaction-text"></p>

            </div>

        </section>


        <!-- =========================
             QUESTION PAGE
        ========================== -->
        <section id="questionPage" class="page">

            <div class="card question-card">

                <div class="progress-area">

                    <span id="questionNumber">
                        Question 1 of 10
                    </span>

                    <div class="progress-bar">
                        <div id="progressFill"></div>
                    </div>

                </div>

                <div id="questionEmoji" class="question-emoji">
                    ❤️
                </div>

                <h1 id="questionText">
                    Question goes here
                </h1>

                <div id="answerButtons" class="answer-buttons">
                    <!-- Buttons created by JavaScript -->
                </div>

                <p id="questionReaction" class="reaction-text"></p>

            </div>

        </section>


        <!-- =========================
             FINAL REPORT
        ========================== -->
        <section id="reportPage" class="page">

            <div class="card report-card">

                <div class="big-heart pulse">
                    ❤️
                </div>

                <h1>Your Love Report</h1>

                <p class="subtitle">
                    Our little relationship report 💕
                </p>

                <div class="love-score-container">

                    <div class="score-circle">

                        <div id="loveScore">
                            100%
                        </div>

                        <span>Love Score</span>

                    </div>

                </div>

                <h2 id="reportTitle">
                    Perfect Match! 💖
                </h2>

                <p id="reportMessage" class="report-message">
                    You two are something special.
                </p>

                <div id="answerSummary" class="answer-summary">
                    <!-- Answers generated by JavaScript -->
                </div>

                <button id="restartButton" class="btn yes-btn">
                    ❤️ Start Again
                </button>

            </div>

        </section>

    </main>


    <!-- Confetti -->
    <div id="confetti-container"></div>

    <script src="script.js"></script>

</body>
</html>
